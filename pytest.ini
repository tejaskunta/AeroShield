[pytest]
# Unit tests for the drone-side modules in jetson/.
#
#   pytest                    # from the repo root
#
# The backend's API tests are a separate suite with its own config and their own
# database dependency:
#
#   cd backend && pytest
#
# Nothing here needs hardware, a database, or a network - these are pure-function
# tests over the geolocation maths and the simulated GPS track.
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
addopts = -ra --strict-markers
