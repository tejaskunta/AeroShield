# AeroShield - Alembic configuration.
#
#   cd backend
#   alembic upgrade head              # apply migrations
#   alembic revision --autogenerate -m "add x"   # create a new one
#   alembic downgrade -1              # undo the last one
#   alembic current                   # what is applied right now
#
# sqlalchemy.url is deliberately NOT set here. migrations/env.py reads it from
# app.core.config.settings, so the database URL lives in exactly one place
# (backend/.env) and this file never holds a credential that could be committed.

[alembic]
script_location = migrations

# Prefix new migration filenames with a UTC timestamp, so `ls versions/` sorts
# chronologically and two people branching on the same day do not produce files
# that sort ambiguously.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

prepend_sys_path = .
timezone = UTC

[post_write_hooks]
# Not enabled. Add a formatter here if the project adopts one.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
