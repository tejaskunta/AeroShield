[pytest]
# asyncio_mode = auto so `async def test_...` needs no per-test decorator.
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
addopts = -ra --strict-markers

# Put backend/ on sys.path so `import app` works when pytest is invoked from
# anywhere. tests/__init__.py already achieves this via pytest's package walk-up;
# this makes it explicit and independent of that behaviour.
pythonpath = .

# The suite needs the Postgres+PostGIS container running:
#     docker compose up -d db
# It uses the SEPARATE aeroshield_test database (created by
# backend/scripts/init-db.sql) and creates/drops tables in it, so it never touches
# development data.
